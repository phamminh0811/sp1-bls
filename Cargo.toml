[workspace]
members = [
    "program/bls-sign",
    "program/bls-verify",
    "script",
]
resolver = "2"

[workspace.dependencies]
alloy-sol-types = "0.7.7"
# milagro_bls = { git = "https://github.com/Snowfork/milagro_bls", rev = "d3fc0a40cfe8b72ccda46ba050ee6786a59ce753", default-features = false }
bls12_381-bls = "0.5.0"
dusk-bls12_381 = { version = "0.14", default-features = false, features = ["alloc", "pairings", "zeroize"] }
dusk-bytes = "0.1"